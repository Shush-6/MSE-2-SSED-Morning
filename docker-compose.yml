# TaskFlow - local development stack (builds the images from source)
# Start:  docker compose up -d --build
name: taskflow

services:
  frontend:
    build:
      context: ./frontend
    image: taskflow-frontend:local
    restart: unless-stopped
    ports:
      - "8080:80"                       # http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy      # nginx resolves "backend" at start-up
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: taskflow-backend:local
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}     # uses host name "postgres", not localhost
      REDIS_URL: ${REDIS_URL}           # uses host name "redis", not localhost
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"                     # http://localhost:3000/health
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [web, data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data                       # persistence
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # creates tables on first start
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  web:    # frontend <-> backend
  data:   # backend <-> postgres, redis (frontend cannot reach the databases)

volumes:
  postgres_data:
